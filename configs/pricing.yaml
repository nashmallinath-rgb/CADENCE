# USD per 1,000,000 tokens (and per unit for media). EVERY VALUE HERE IS A PLACEHOLDER.
# Provider prices change often. Check each model against the provider's current pricing
# page, then set `verify: false`. Costs drive the Pareto front, so wrong prices mean a
# wrong front. `python -m cadence.cli` will warn while any used model is still unverified.
#
# Unknown models fall back to `default`, which is deliberately pessimistic so the budget
# guard errs on the side of stopping early.

default:
  input_per_mtok: 5.00
  output_per_mtok: 15.00
  verify: true

models:
  # Gemini: ai.google.dev/gemini-api/docs/pricing (paid-tier list prices; free tier bills $0 but we use list price so cost objectives stay comparable)
  gemini/gemini-3.1-flash-lite:
    input_per_mtok: 0.25
    output_per_mtok: 1.50
    verify: false
  gemini/gemini-3.5-flash-lite:
    input_per_mtok: 0.30
    output_per_mtok: 2.50
    verify: false
  gemini/gemini-2.5-flash:
    input_per_mtok: 0.30
    output_per_mtok: 2.50
    verify: false
  gemini/gemini-2.5-flash-lite:
    input_per_mtok: 0.10
    output_per_mtok: 0.40
    verify: false
  # Gemma 4: free on the Gemini API free tier; paid price NOT confirmed (page was truncated). Priced 0 so judge calls
  # do not eat the budget; revisit if you move to a paid key.
  gemini/gemma-4-26b-a4b-it:
    input_per_mtok: 0.0
    output_per_mtok: 0.0
    verify: true
  gemini/gemma-4-31b-it:
    input_per_mtok: 0.0
