# CADENCE role -> LiteLLM model slots.
# LiteLLM prefixes: gemini/<model>, openai/<model>
# Names below were checked against the models our keys list (scripts/list_models.py).
# Run `python -m cadence.cli check-setup` to confirm each role actually answers.

roles:
  generator: gemini/gemini-3.1-flash-lite        # free tier; the model whose prompts we optimize
  reflector: gemini/gemini-2.5-flash             # free tier; rewrites prompts
  cheap_judge: openai/gpt-4.1-mini               # paid, non-reasoning (accepts temperature)
  strong_judge: openai/gpt-4.1                   # paid, escalation only
  second_family_judge: gemini/gemini-2.5-flash   # held-out check; same family as generator (self-preference gap is measured)
  image_gen: gemini/imagen-3.0-generate-002      # placeholder until Phase 7
  tts: gemini/gemini-2.5-flash-preview-tts       # placeholder until Phase 7
  asr_or_audio_judge: gemini/gemini-2.0-flash    # placeholder until Phase 7
